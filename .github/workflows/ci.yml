name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pre-commit flake8
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run flake8
        run: flake8 --select=E9,F63,F7,F82 src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install . pytest
      - name: Run tests
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install build dependencies
        run: pip install build twine
      - name: Sync version in pyproject with tag
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ['GITHUB_REF_NAME']
          if not tag.startswith('v'):
              sys.exit(f'Unexpected tag format: {tag}')
          version = tag[1:]
          path = pathlib.Path('pyproject.toml')
          content = path.read_text()
          content = re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{version}"', content, flags=re.MULTILINE)
          path.write_text(content)
          PY
      - name: Check version tag matches
        run: |
          python - <<'PY'
          import os, re, pathlib, sys
          content = pathlib.Path('pyproject.toml').read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', content, re.MULTILINE)
          version = match.group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              sys.exit(f'Tag {tag} does not match version {version}')
          PY
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

